  <!-- The initials KP as one mark: the arms of the K run into the stem of the
       P. Each letter is 6 units wide and 12 tall, so together they fill a
       square with 2 units of margin all round. Drawn on a 16-unit grid with
       2-unit stems, so it stays sharp at the 16-pixel size of a browser tab. -->
